site_name: Gron for Mere Mortals
site_description: A small tool that flattens JSON into one statement per value so the text tools you already know (grep, sed, sort) can search and edit it, and then rebuilds the JSON from the statements you kept, with the round trip proved and the limits stated plainly.
site_url: https://paulsullivan33-dev.github.io/gron-for-mere-mortals/
